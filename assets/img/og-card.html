<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "Inter", sans-serif;
    background:
      radial-gradient(70% 90% at 88% 10%, rgba(113, 38, 255, 0.22), transparent 60%),
      radial-gradient(60% 80% at 5% 95%, rgba(184, 50, 112, 0.28), transparent 60%),
      linear-gradient(135deg, #32135f 0%, #4a2a7d 55%, #6d2260 100%);
    color: #fff;
    display: flex; align-items: center;
    position: relative;
  }
  .wrap { padding: 0 90px; position: relative; z-index: 2; max-width: 780px; }
  .mark {
    width: 92px; height: 92px; border-radius: 26px;
    background: linear-gradient(135deg, #b83270, #7126ff);
    display: grid; place-items: center;
    font-family: "Fraunces", serif; font-size: 42px; font-weight: 700;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
    margin-bottom: 44px;
  }
  h1 {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: 78px; line-height: 1.08; letter-spacing: -0.5px;
    margin-bottom: 22px;
  }
  .sub {
    font-size: 32px; font-weight: 600; color: #f3a7cb;
    margin-bottom: 34px;
  }
  .loc {
    display: inline-flex; align-items: center; gap: 14px;
    font-size: 22px; font-weight: 500; color: #e1dcfd; white-space: nowrap;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(225,220,253,0.35);
    border-radius: 999px; padding: 13px 26px;
  }
  .loc .dot { width: 11px; height: 11px; border-radius: 50%; background: #e64f96; }
  .ring {
    position: absolute; border-radius: 50%; border: 2px solid rgba(225,220,253,0.18);
  }
  .r1 { width: 560px; height: 560px; right: -160px; top: -160px; }
  .r2 { width: 380px; height: 380px; right: -60px; top: -60px; }
  .r3 { width: 760px; height: 760px; right: -260px; top: -260px; }
  .portrait {
    position: absolute; right: 84px; top: 50%; transform: translateY(-50%);
    width: 330px; height: 330px; border-radius: 50%;
    background: radial-gradient(circle at 35% 25%, #ffffff, #d2c9f7 75%);
    border: 9px solid rgba(255,255,255,0.9);
    box-shadow: 0 24px 70px rgba(0,0,0,0.4);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <img class="portrait" src="dra-bianca-portrait.png"><div class="wrap">
    <div class="mark">BR</div>
    <h1>Dra. Bianca Rubí<br>Flores Reyes</h1>
    <div class="sub">Médico Especialista en Anestesiología</div>
    <div class="loc"><span class="dot"></span>La Paz · Los Cabos · San José del Cabo — B.C.S.</div>
  </div>
</body>
</html>
